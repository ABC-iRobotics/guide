# Free the arm and open the hand at rest: to the rest pose, 10 cm down (which moves the arm even if it
# already was at rest), open. An attempt that broke off can leave the wrist at its limits (a failed Turn left
# joint 6 at 4.517 rad), where the straight line to rest has no IK and every later attempt failed here: a refused
# MoveToRest goes home in joint space first. Unclutch runs before StartEpisode, so the detour is never recorded.
node_type: CompositeNode
name: Unclutch
level: SUBTASK
dynamic_map: {robot: robot, rest_pose: rest_pose}
children:
  - ref: MoveToCartesianPose
    alias: MoveToRest
    dynamic_map: {robot: robot, target_pose: rest_pose}
    static_args: {speed: 1.0}
  - ref: TransformPose
    alias: TransformUnclutchPose
    dynamic_map: {r_pose: rest_pose}
    static_args:
      l_pose: {position: [0.0, 0.0, -0.1]}
    output_map: {pose: unclutch_pose}
  - ref: MoveToCartesianPose
    alias: MoveToUnclutch
    dynamic_map: {robot: robot, target_pose: unclutch_pose}
    static_args: {speed: 1.0}
  - ref: OpenGripper
  - ref: WaitForSeconds
    alias: WaitAfterOpen
    dynamic_map: {timer: robot}
    static_args: {seconds: 0.5}
fallbacks:
  MoveToRest:
    node_type: RecoveryNode
    name: UnclutchViaHome
    level: SEQUENCE
    dynamic_map: {robot: robot}
    resume_target: MoveToRest
    max_retries: 1
    children:
      - {ref: MoveHome, alias: UnclutchViaHomeToHome}
