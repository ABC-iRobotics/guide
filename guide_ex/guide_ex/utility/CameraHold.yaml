# Hold the arm still while dataset.camera_transition moves the cameras onto their mounts; only with
# the transition on (${episode.camera_hold}), for its duration plus one frame period (${episode.hold_seconds}).
ref: WaitForSeconds
alias: WaitForCameras
when: ${episode.camera_hold}
dynamic_map: {timer: robot}
static_args:
  seconds: ${episode.hold_seconds}
