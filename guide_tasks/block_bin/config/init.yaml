usd_path: '/assets/block_bin.usd'

# Publish the cameras as ROS 2 image topics (/cam_*). OFF for dataset generation: the
# recorder captures images GUIDE-side via annotators, so the topics are a second render
# product per camera plus ~166 MB/s of raw images that floods localhost DDS and starves
# service replies. Turn ON at inference time, when a deployed policy needs live camera
# images over ROS -- either here, or without editing this file:
#   ros2 launch guide_core bringup.launch.py camera_topics:=true
# (block_bin_eval's eval_policy_pink documents exactly that, and stops at start-up without the topics.)
publish_camera_topics: false

# Wire format of the rgb topics, when they are published at all.
#   rgb       sensor_msgs/Image on <topic>            -- 640x480 rgb8, 921 kB a frame
#   rgb_h264  sensor_msgs/CompressedImage on          -- NVENC H.264, ~1% of the bytes
#             <topic>/compressed
# Subscribers are not configured to match: ros2camera asks the ROS graph which of the
# two the camera helper created. H.264 costs nothing to render and everything it saves
# is DDS bandwidth, so it is worth turning on wherever the topics are on at all --
# 'rgb' stays the default only because it is the format every existing tool expects.
camera_encoding: rgb_h264

robots:
  franka :
    path: '/fr3'
    end_effector_name: 'fr3_hand_tcp'
    # The recorded end-effector pose (observation.state x..wz) is relative to this prim.
    base_name: 'fr3_link0'
    default_joint_states:
      - 0.0
      - -0.785398
      - 0.0
      - -2.35619
      - 0.0
      - 1.5708
      - 0.785398
      - 0.0
      - 0.0
    # Motion layer (S2b). moveit: move_group + ros2_control over joint_command.
    # oscbf (the default): guide_motion's OSCBF controller in Isaac's physics step, fed MotionTargets by
    # ROS2Robot; the block_bin bring-up then starts no move_group. Under oscbf the arm's drives
    # are effort (torque) or velocity drives, so config/reset.yaml's drive-target homing does
    # not move it; GUIDE's Reset homes it through the OSCBF host instead (Ruling 2): a JOINTS
    # target at default_joint_states, held until the next MotionTarget arrives.
    controller: oscbf
    oscbf:
      robot: fr3       # guide_motion/guide_motion/robots/<robot>
      mode: torque     # torque | velocity; both run once per rendered frame (60 Hz, physics 120 Hz); rate: <Hz> overrides
      gains: {}        # overrides of guide_motion.control.GAINS[mode]
      barriers: {}     # overrides of guide_motion.control.BARRIERS
      # obstacles: []  # this robot's own, added to the scene's `obstacles` below (same entries)
      # obstacle_update_hz: 0  # overrides the scene's

# Objects that must not move, as OSCBF barriers of every robot with controller: oscbf. Each entry:
#   path:      prim path relative to the scene root, as dataset.tracked_objects (one prim, no pattern)
#   shape:     collision (one box per collider gprim under it, one barrier each: the bin's 9 Cubes keep its inside free) | obb (one box)
#   margin:    m kept clear of the boxes, default 0.01
#   kinematic: true makes its rigid body kinematic at registration (never an articulation); default false
# A bad entry, or a path with no prim, fails the registration. The poses are read at registration, on play,
# and after every Randomize and Reset; obstacle_update_hz > 0 also reads them that often while playing
# (2 bins: 0.25-0.29 ms a read in Isaac, S2b obstacles report).
# margin 0.03: driven into a bin's inner corner at 0.01 the arm still shoved the bin 12 mm (geometry the FR3's
# collision spheres do not cover, 1-3 cm out); at 0.03, 0 mm (S2b obstacles review, Isaac push test).
obstacles:
  - {path: '/bin_0', shape: collision, margin: 0.03}
  - {path: '/bin_1', shape: collision, margin: 0.03}
# obstacle_update_hz: 0

# `rgb`, `depth` and `instance` are independent streams off one render product (no
# extra RTX pass). They decide the dataset feature names: <key>, <key>_depth and
# <key>_instance; a camera whose only stream is depth (or instance) records <key>.
#
# Only `rgb` is published to ROS 2. Depth is captured in-process by the annotator and
# goes straight into the dataset as (H, W, 1) uint16 millimetres -- the shape lerobot
# flags as is_depth_map and encodes losslessly. `instance` is instance segmentation of
# dataset.tracked_objects below, recorded as an RGB video with one fixed colour per
# tracked object. Nothing subscribes to either, and 32FC1 on the wire costs more than
# the colour image it would sit beside.
cameras:
  top:
    path: '/top'
    width: 640
    height: 480
    topic: '/cam_top'
    rgb: true
    depth: true
    instance: true

  base:
    path: '/base'
    width: 640
    height: 480
    topic: '/cam_base'
    rgb: true
    depth: true
    instance: true

  wrist:
    path: '/fr3/rsd455/RSD455/Camera_OmniVision_OV9782_Color'
    width: 640
    height: 480
    topic: '/cam_wrist'
    rgb: true
    depth: true
    instance: true

dataset:
  # Tracked objects: the prims marked in the instance-segmentation stream (a camera's
  # `instance: true`). The key is the object's label; the value is a prim-path pattern
  # relative to the scene root -- the same syntax reset.yaml and randomize.yaml use for
  # `prim_path`. Each label is painted in a fixed colour: its dataset.segmentation colour
  # below, or without one, in this order (tab10 palette: blue, orange, green, red, purple,
  # brown, pink, ...); everything untracked is black. The label -> colour legend is written
  # to the dataset's meta/guide_info.json.
  #
  # A pattern that matches several prims gives them all one label ('/blocks/*' would
  # label every block "block") and so one colour. Each block is named separately here so
  # the mask says which block, not just that a block is there. The blocks are listed in
  # this order so each one's mask colour matches its name (blue, orange~yellow, green, red).
  tracked_objects:
    blue_block: '/blocks/blue_block'
    yellow_block: '/blocks/yellow_block'
    green_block: '/blocks/green_block'
    red_block: '/blocks/red_block'
    bin_0: '/bin_0'
    bin_1: '/bin_1'
    robot: '/fr3'
  # Segmentation colours of the tracked objects above, in place of tab10. Each key under
  # `colors` is a tracked_objects label (anything else fails the registration); its value is
  # an explicit [r, g, b] or <table>:<name>, the name looked up in that table's Name column:
  # the whole ';'-joined cell first, then its first token, then any token -- a name that
  # several rows share at the deciding step, or none has, fails the registration. A tracked
  # object left out keeps its tab10 colour. Objects of one class share a colour, so the
  # stream is a semantic mask. The legend (label -> path, source, RGB) goes into
  # meta/guide_info.json under `segmentation`. Delete the section for the tab10 colours.
  segmentation:
    tables:              # name -> CSV with a Name and a Color_Code (R,G,B) column
      ade20k: ade20k     # bare name: guide_core/config/segmentation_colors/<name>.csv; or a path (absolute, or relative to the task dir)
    colors:
      blue_block: ade20k:box
      yellow_block: ade20k:box
      green_block: ade20k:box
      red_block: ade20k:box
      bin_0: ade20k:basket
      bin_1: ade20k:basket
      robot: ade20k:computer
      # table: [255, 6, 82]   # or an explicit RGB (for a tracked object labelled `table`)
    background: [0, 0, 0]  # everything no tracked object covers
  # Capture rate, in Hz. One number for three things that used to disagree: the rate
  # SceneManager samples the scene at, the rate the ROS 2 camera topics are gated to
  # (they publish every rendered frame otherwise -- 60 Hz), and the fps stamped into
  # the LeRobot dataset metadata. 10 is what this task has always actually recorded at;
  # the metadata said 30 only because the key was never set.
  fps: 10
  # Every episode opens with every camera on one viewpoint: they start on `from`'s pose and
  # ease (smoothstep; lerp + slerp) onto their own mounts, each with its own resolution and
  # streams. The solver (launch/bringup.launch.py reads `duration`) holds the arm still meanwhile.
  camera_transition:
    enabled: true      # false: episodes start with every camera already at its own viewpoint (today's behaviour)
    duration: 2.0      # s of sim time at the start of every recorded episode; the robot holds still
    from: base         # key under `cameras:` whose pose every other camera starts from
    label: Startup     # language label of the padding frames (searchable, removable later)
  images:
    - top: top
    - base: base
    - wrist: wrist
  # Opt-in extra modalities, off when left out (this dataset's features stay as they are):
  #   velocity: true    adds observation.velocity (joint velocities, observation.state's joints, ".vel") and
  #                     observation.tcp_twist (J(q) qd at the TCP: vx vy vz m/s, wx wy wz rad/s, in the TCP's own axes)
  #   tcp_wrench: true  adds observation.tcp_wrench (fx fy fz N, tx ty tz N m: the wrench the environment applies
  #                     to the TCP, in the TCP's own axes, moments about the TCP; PhysX's hand-link joint force, gravity-tared)
  # Both need robots.<r>.oscbf.robot (the guide_motion model) and the cartesian_velocity_robot below.
  cartesian_velocity_robot: franka
  observations:
    - joint1.pos: franka.fr3_joint1.pos
    - joint2.pos: franka.fr3_joint2.pos
    - joint3.pos: franka.fr3_joint3.pos
    - joint4.pos: franka.fr3_joint4.pos
    - joint5.pos: franka.fr3_joint5.pos
    - joint6.pos: franka.fr3_joint6.pos
    - joint7.pos: franka.fr3_joint7.pos
    - gripper.pos: franka.fr3_finger_joint1.pos
    - x: x
    - y: y
    - z: z
    - wx: wx
    - wy: wy
    - wz: wz
  action:
    - joint1.pos: joint_command.fr3_joint1.pos
    - joint2.pos: joint_command.fr3_joint2.pos
    - joint3.pos: joint_command.fr3_joint3.pos
    - joint4.pos: joint_command.fr3_joint4.pos
    - joint5.pos: joint_command.fr3_joint5.pos
    - joint6.pos: joint_command.fr3_joint6.pos
    - joint7.pos: joint_command.fr3_joint7.pos
    - gripper.pos: joint_command.fr3_finger_joint1.pos
    - x: x
    - y: y
    - z: z
    - wx: wx
    - wy: wy
    - wz: wz

# Scene extent around origin, metres: [[x_min, x_max], [y_min, y_max], [z_min, z_max]].
# Scenes are tiled along y by this box when several are registered.
limits:
  - [-5.0, 5.0]
  - [-5.0, 5.0]
  - [-5.0, 5.0]

origin:
  - 0.0
  - 0.0
  - -1.0
