# block_bin randomization in Replicator YAML (spike). Every key is <module>.<function> under
# omni.replicator.core; `guide.*` is GUIDE's namespace. Paths are scene-relative: GUIDE prefixes
# /Scene_<id> before parsing. The bins are fixed; the blocks are drawn independently, one draw
# per prim, and the colour-selected block is re-placed in the requested zone by GUIDE after
# this group (see replicator_guide.draw). Groups a randomizer uses are declared inside it: the
# parser evaluates a registered body when the randomizer is called, not where it is written.

place_blocks:
  randomizer.register:
    place_blocks:
      blocks:
        get.prims:
          path_pattern: '/blocks/[^/]+$'         # the block Xforms only, not their meshes
          path_pattern_exclusion: 'properties'
      with.blocks:
        modify.pose:
          write_to_usd: true                     # PhysX teleports on USD writes, not Fabric;
                                                 # poses stay local to the parent and keep scale
          position:
            distribution.uniform:                # absolute bounds, metres
              lower: [-0.25, 0.0, 0.025]
              upper: [ 0.25, 0.4, 0.025]
              name: blocks_position              # named: samples are recorded per episode
          rotation:
            distribution.uniform:                # Euler XYZ, degrees
              lower: [0, 0, -180]
              upper: [0, 0,  180]
              name: blocks_rotation
          # equivalent axis-angle form for the same slot:
          # rotation:
          #   guide.axis_angle: { axis: [0, 0, 1], angle: [-180, 180] }

place_bins:
  randomizer.register:
    place_bins:
      bin_0:
        get.prims: { path_pattern: '/bin_0$' }
      bin_1:
        get.prims: { path_pattern: '/bin_1$' }
      with.bin_0:
        modify.pose: { position: [0.25, -0.4, 0.09], rotation: [0, 0, 0], write_to_usd: true }
      with.bin_1:
        modify.pose: { position: [0.25,  0.4, 0.09], rotation: [0, 0, 0], write_to_usd: true }

episode:
  trigger.on_custom_event:
    event_name: guide_randomize                  # fired once per Randomize call

with_episode:
  with.episode:
    randomizer.place_blocks: null
    randomizer.place_bins: null
    guide.zone:                                  # after place_blocks: re-draws the zone target in its cell
      distribution: blocks_position              # region = that node's lower/upper
      path_pattern: '/blocks/[^/]+$'             # narrowed to the target prim per episode
      resolution: 0.1                            # 5 x 4 = 20 cells, row-major from the min corner
