# block_bin: the color-selected cube is placed in the requested zone; the other
# blocks are free disturbances; the bins are FIXED (not randomized).
# Grid: region [-0.25, 0.0] .. [0.25, 0.4] (in front of the robot), 0.1 m cells
# -> 5 columns x 4 rows = 20 zones (row-major, 0-indexed from the min corner).
#
# The grid is INERT for free demos: draw_instructions only consults it when the
# Randomize request sets use_zone=true, so unzoned generation draws uniformly
# over the whole region exactly as before.
instructions:
  - cmd: 'set_local_poses'
    kwargs:
      prim_path: '/blocks/*'
      pose:
        position:
          value: [0.0, 0.0, 0.025]
          random:            # [[x_min, x_max], [y_min, y_max], [z_min, z_max]], offsets from value
            - [-0.25, 0.25]
            - [0.0, 0.4]
            - [0.0, 0.0]
          grid:
            enabled: true
            resolution: 0.1
        orientation:
          random:
            axis: [0.0, 0.0, 1.0]
            angle: [-180, 180]   # [min, max] degrees about axis
    parallel: false

  - cmd: 'set_local_poses'
    kwargs:
      prim_path: '/bin_0'
      pose:
        position:
          value: [0.25, -0.4, 0.09]
          # Bin randomization, disabled for zoned generation: a moving bin makes the
          # place target vary independently of the cube's zone, which muddies the
          # zone -> success correlation the stratified dataset is meant to measure.
          # Uncomment (both bins) to restore the original free-bin task.
          # random:
          #   - [-0.05, 0.05]
          #   - [-0.05, 0.05]
          #   - [0.0, 0.0]
        orientation:
          value: [0.0, 0.0, 0.0]
          # random:
          #   axis: [0.0, 0.0, 1.0]
          #   angle: [-180, 180]
    parallel: false

  - cmd: 'set_local_poses'
    kwargs:
      prim_path: '/bin_1'
      pose:
        position:
          value: [0.25, 0.4, 0.09]
          # random:
          #   - [-0.05, 0.05]
          #   - [-0.05, 0.05]
          #   - [0.0, 0.0]
        orientation:
          value: [0.0, 0.0, 0.0]
          # random:
          #   axis: [0.0, 0.0, 1.0]
          #   angle: [-180, 180]
    parallel: false
