# Route 4, the loop: each pass measures the tower and stacks the next cube onto the highest one still
# in place, so a placement that did not hold is just the next pass. One pass per placement, one to see
# the tower done and finish, and 3 spare (${tower.max_loops} in all).
node_type: CompositeNode
name: BuildTower
level: PROCEDURE
dynamic_map: &tower
  robot: robot
  sim_namespace: sim_namespace
  scene_namespace: scene_namespace
  scene_id: scene_id
  robot_prim: robot_prim
  scene_pose_inv: scene_pose_inv
  order: order
  tasks: tasks
  picks: picks
  places: places
  set_downs: set_downs
  finish: finish
mode: loop
condition_expr: done
max_loops: ${tower.max_loops}
children:
  - node_type: CompositeNode
    name: NextCube
    level: TASK
    dynamic_map: *tower
    children:
      - ref: MeasureTower
      - ref: TowerHeight
    mode: condition
    condition_expr: done
    true_branch: {ref: Finish}
    false_branch: {ref: StackPutOn}
