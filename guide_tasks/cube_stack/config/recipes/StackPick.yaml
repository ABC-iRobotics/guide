# Pick the next cube (top) up: announce it, 0.275 m over its centre (the TCP ~30 cm over the table; a
# perturbed episode misses it there, the descent corrects), down to 6 cm over the centre, slowly the
# last 5 cm to the grasp 1 cm above it, close, lift back up, and fail (NotHolding) unless it is in the fingers.
# Retry demonstrations (the solver's --recipe, config/variants, MissPose): the pre-grasp target may lie
# off the cube, the descent correcting it (miss.pre_grasp); the grasp target may lie beside it
# (miss.grasp): the hand closes on air, lifts, fails NotHolding, and PutOn's Regrasp reopens and picks
# it again, at the cube this time (MissPose misses a goal once; a planned miss once per cube).
# Every move detours through the home joints before it is tried again.
node_type: CompositeNode
name: Pick
level: SUBTASK
dynamic_map:
  robot: robot
  sim_namespace: sim_namespace
  scene_namespace: scene_namespace
  scene_id: scene_id
  robot_prim: robot_prim
  scene_pose_inv: scene_pose_inv
  top: top
  support: support
  cube_pose: cube_pose
  pick: pick
children:
  - ref: SetPrompt
    alias: AnnouncePick
    dynamic_map: {robot: robot, sim_namespace: sim_namespace, scene_id: scene_id, subtask: pick}
  # Near the tower (a cube that fell off it) the hand's narrow side faces the tower, the fingers
  # closing along it, so the re-pick leaves the tower alone.
  - ref: GetPrimPose
    alias: GetTowerPose
    dynamic_map: {robot: robot, sim_namespace: sim_namespace, scene_namespace: scene_namespace, prim_path: support}
    output_map: {pose: tower_pose}
  - ref: TransformPose
    alias: TowerInScene
    dynamic_map: {l_pose: scene_pose_inv, r_pose: tower_pose}
    output_map: {pose: tower_pose}
  - ref: FaceNarrowSide
    alias: GraspAlongTower
    dynamic_map: {pose: cube_pose, obstacle: tower_pose}
    output_map: {pose: cube_pose}
  - ref: TransformPose
    alias: OverCubePose
    dynamic_map: {r_pose: cube_pose}
    static_args:
      l_pose: {position: [0.0, 0.0, 0.275]}
    output_map: {pose: over_cube_pose}
  - ref: MoveToCartesianPose
    alias: MoveOverCube
    dynamic_map: {robot: robot, target_pose: over_cube_pose}
    static_args: {speed: 0.5, cartesian: true, perturb: true, precise_end: false, aim: true}
  - ref: TransformPose
    alias: PreGraspPose
    dynamic_map: {r_pose: cube_pose}
    static_args:
      l_pose: {position: [0.0, 0.0, 0.06]}
    output_map: {pose: pre_grasp_pose}
  - ref: MissPose
    alias: MissPreGrasp
    dynamic_map: {pose: pre_grasp_pose, key: top}
    static_args: {miss: "${oc.select:miss.pre_grasp,null}", seed: "${oc.select:miss.seed,0}"}
    output_map: {pose: pre_grasp_target}
  - ref: MoveToCartesianPose
    alias: MoveToPreGrasp
    dynamic_map: {robot: robot, target_pose: pre_grasp_target}
    static_args: {speed: 0.2, cartesian: true, precise_end: false}
  - ref: TransformPose
    alias: GraspPose
    dynamic_map: {r_pose: cube_pose}
    static_args:
      l_pose: {position: [0.0, 0.0, 0.01]}
    output_map: {pose: grasp_pose}
  - ref: MissPose
    alias: MissGrasp
    dynamic_map: {pose: grasp_pose, key: top}
    static_args: {miss: "${oc.select:miss.grasp,null}", seed: "${oc.select:miss.seed,0}"}
    output_map: {pose: grasp_target}
  - ref: MoveToCartesianPose
    alias: MoveToGrasp
    dynamic_map: {robot: robot, target_pose: grasp_target}
    static_args: {speed: 0.1, cartesian: true}
  - ref: CloseGripper
  - ref: WaitForSeconds
    alias: CloseGripperSettle
    static_args: {seconds: 2.0}
  - ref: MoveToCartesianPose
    alias: LiftCube
    dynamic_map: {robot: robot, target_pose: over_cube_pose}
    static_args: {speed: 0.5, cartesian: true, perturb: true, precise_end: false}
  - ref: IsPrimClashing
    alias: CheckHolding
    dynamic_map:
      robot: robot
      sim_namespace: sim_namespace
      scene_namespace: scene_namespace
      prim1_path: robot_prim
      prim2_path: top
    output_map: {has_collided: holding}
mode: condition
condition_expr: holding
false_branch: {ref: NodeException, alias: NotHolding}
fallbacks:
  MoveOverCube:
    node_type: RecoveryNode
    name: OverCubeViaHome
    level: SEQUENCE
    dynamic_map: {robot: robot}
    resume_target: MoveOverCube
    max_retries: 2
    children:
      - {ref: MoveHome, alias: OverCubeViaHomeToHome}
  MoveToPreGrasp:
    node_type: RecoveryNode
    name: PreGraspViaHome
    level: SEQUENCE
    dynamic_map: {robot: robot}
    resume_target: MoveOverCube
    max_retries: 2
    children:
      - {ref: MoveHome, alias: PreGraspViaHomeToHome}
  MoveToGrasp:
    node_type: RecoveryNode
    name: GraspViaHome
    level: SEQUENCE
    dynamic_map: {robot: robot}
    resume_target: MoveOverCube
    max_retries: 2
    children:
      - {ref: MoveHome, alias: GraspViaHomeToHome}
  LiftCube:
    node_type: RecoveryNode
    name: LiftViaHome
    level: SEQUENCE
    dynamic_map: {robot: robot}
    resume_target: CheckHolding
    max_retries: 2
    children:
      - {ref: MoveHome, alias: LiftViaHomeToHome}
