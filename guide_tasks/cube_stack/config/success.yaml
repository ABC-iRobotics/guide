# Success = one tower in this episode's order. Scene.is_success_preprocess turns this
# into one get_world_poses per cube, bottom first, and is_success_postprocess checks that
# each cube rests on the one below it (the tree's TowerProgress uses the same test).
instructions:
  - cmd: 'get_world_poses'
    kwargs:
      prim_path: '/blocks/*'
