# cube_stack: the four cubes land anywhere in front of the robot, each with its own pose
# and yaw. Scene.randomize redraws any layout with two cubes closer than 12 cm, so an
# open gripper always fits around the cube it picks and around the tower it builds.
# Region, scene frame: x [0.10, 0.30], y [-0.25, 0.25], i.e. 40-60 cm in front of the
# robot base (x = -0.3). Closer in, a top-down reach to the table folds the forearm into
# the shoulder (MoveIt: fr3_link1 - fr3_link5 contact); farther out it runs out of reach.
# All of it is in both fixed cameras' view up to the full tower height.
#
# The numbers below are in the frame of /blocks, which block_bin.usd turns -90 deg about
# z (rotateZYX = (0, 0, -90)): local x = -scene y, local y = scene x.
#
# The stacking order is drawn by the scene (Scene.randomize_preprocess), not here.
instructions:
  - cmd: 'set_local_poses'
    kwargs:
      prim_path: '/blocks/*'
      pose:
        position:
          value: [0.0, 0.2, 0.025]
          random:            # [[x_min, x_max], [y_min, y_max], [z_min, z_max]], offsets from value
            - [-0.25, 0.25]  # scene y
            - [-0.10, 0.10]  # scene x
            - [0.0, 0.0]
        orientation:
          random:
            axis: [0.0, 0.0, 1.0]
            angle: [-180, 180]   # [min, max] degrees about axis
    parallel: false

  # The bins are not part of this task. They are dynamic rigid bodies, so they are set
  # down on the room floor (ground plane at z = -0.769, so origin at -0.68) 3 m behind
  # the base camera: outside the top and base cameras' frustums and ~2.7 m from anywhere
  # the wrist camera goes. Re-placed every episode in case anything moved them.
  - cmd: 'set_local_poses'
    kwargs:
      prim_path: '/bin_0'
      pose:
        position:
          value: [3.0, -0.5, -0.68]
        orientation:
          value: [0.0, 0.0, 0.0]
    parallel: false

  - cmd: 'set_local_poses'
    kwargs:
      prim_path: '/bin_1'
      pose:
        position:
          value: [3.0, 0.5, -0.68]
        orientation:
          value: [0.0, 0.0, 0.0]
    parallel: false
