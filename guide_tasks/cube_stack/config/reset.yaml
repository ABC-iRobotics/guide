# cube_stack reset in Replicator YAML. Runs only on the /Sim_*/Reset service: the cubes in
# a row across the table 50 cm in front of the robot base, the arm home, the bins parked
# and hidden as randomize.yaml keeps them. Native nodes only, as block_bin's reset:
# modify.pose written to USD (PhysX teleports the bodies) and joint drive targets via
# modify.attribute (revolute drives take degrees, prismatic metres).
#
# Each distinct value is its own prim group (a list of constants cannot feed one node),
# and the work is split over three triggers on the same event: Replicator's registration
# time grows exponentially with the `with` blocks under one trigger.
# Cube positions are in the /blocks frame (turned -90 deg: local x = -scene y, local y =
# scene x).

home_objects:
  randomizer.register:
    home_objects:
      red:    { get.prims: { path_pattern: '/blocks/red_block$' } }
      yellow: { get.prims: { path_pattern: '/blocks/yellow_block$' } }
      green:  { get.prims: { path_pattern: '/blocks/green_block$' } }
      blue:   { get.prims: { path_pattern: '/blocks/blue_block$' } }
      bin_0:  { get.prims: { path_pattern: '/bin_0$' } }
      bin_1:  { get.prims: { path_pattern: '/bin_1$' } }
      with.red:    { modify.pose: { position: [ 0.225, 0.2, 0.025], rotation: [0, 0, 0], write_to_usd: true } }
      with.yellow: { modify.pose: { position: [ 0.075, 0.2, 0.025], rotation: [0, 0, 0], write_to_usd: true } }
      with.green:  { modify.pose: { position: [-0.075, 0.2, 0.025], rotation: [0, 0, 0], write_to_usd: true } }
      with.blue:   { modify.pose: { position: [-0.225, 0.2, 0.025], rotation: [0, 0, 0], write_to_usd: true } }
      with.bin_0:
        modify.pose: { position: [3.0, -0.5, -0.68], rotation: [0, 0, 0], write_to_usd: true }
        modify.visibility: { value: false }
      with.bin_1:
        modify.pose: { position: [3.0, 0.5, -0.68], rotation: [0, 0, 0], write_to_usd: true }
        modify.visibility: { value: false }

home_arm:
  randomizer.register:
    home_arm:
      j1: { get.prims: { path_pattern: '/fr3/.*/fr3_joint1$' } }
      j2: { get.prims: { path_pattern: '/fr3/.*/fr3_joint2$' } }
      j3: { get.prims: { path_pattern: '/fr3/.*/fr3_joint3$' } }
      j4: { get.prims: { path_pattern: '/fr3/.*/fr3_joint4$' } }
      j5: { get.prims: { path_pattern: '/fr3/.*/fr3_joint5$' } }
      j6: { get.prims: { path_pattern: '/fr3/.*/fr3_joint6$' } }
      j7: { get.prims: { path_pattern: '/fr3/.*/fr3_joint7$' } }
      with.j1: { modify.attribute: { name: 'drive:angular:physics:targetPosition', attribute_type: float, value: 0.0 } }     # degrees
      with.j2: { modify.attribute: { name: 'drive:angular:physics:targetPosition', attribute_type: float, value: -45.0 } }
      with.j3: { modify.attribute: { name: 'drive:angular:physics:targetPosition', attribute_type: float, value: 0.0 } }
      with.j4: { modify.attribute: { name: 'drive:angular:physics:targetPosition', attribute_type: float, value: -135.0 } }
      with.j5: { modify.attribute: { name: 'drive:angular:physics:targetPosition', attribute_type: float, value: 0.0 } }
      with.j6: { modify.attribute: { name: 'drive:angular:physics:targetPosition', attribute_type: float, value: 90.0 } }
      with.j7: { modify.attribute: { name: 'drive:angular:physics:targetPosition', attribute_type: float, value: 45.0 } }

home_fingers:
  randomizer.register:
    home_fingers:
      f1: { get.prims: { path_pattern: '/fr3/.*/fr3_finger_joint1$' } }
      f2: { get.prims: { path_pattern: '/fr3/.*/fr3_finger_joint2$' } }
      with.f1: { modify.attribute: { name: 'drive:linear:physics:targetPosition', attribute_type: float, value: 0.0 } }   # metres
      with.f2: { modify.attribute: { name: 'drive:linear:physics:targetPosition', attribute_type: float, value: 0.0 } }

# Three triggers on one event, so each downstream chain stays short (see above).
on_reset_objects:
  trigger.on_custom_event: { event_name: guide_reset }
on_reset_arm:
  trigger.on_custom_event: { event_name: guide_reset }
on_reset_fingers:
  trigger.on_custom_event: { event_name: guide_reset }
with_reset_objects:
  with.on_reset_objects: { randomizer.home_objects: null }
with_reset_arm:
  with.on_reset_arm: { randomizer.home_arm: null }
with_reset_fingers:
  with.on_reset_fingers: { randomizer.home_fingers: null }
