# Tool down throughout (turned level, the block slid out of the jaws): the giver brings the block it
# holds to the handover marker (/PegTransfer/handover, jittered by randomize.yaml), turned so that one
# of its free walls faces the receiver (targets.HandoverPoses); the receiver comes over that
# wall, opens and takes it from above like a grasp (Receive, which fails NotReceived unless the block sits in
# its jaws: targets.IsHeld). The giver lets go, backs 20 mm up and goes home.
# retry_mixed / light_fail (MissPose miss.receive): the receiver closes 18-22 mm along the wall, on
# air; Rereceive opens it, lifts it back over the wall and Receive runs again.
node_type: CompositeNode
name: HandOver
level: SUBTASK
dynamic_map: {robot: robot, giver: giver, receiver: receiver, sim_namespace: sim_namespace, scene_namespace: scene_namespace, scene_id: scene_id, giver_scene: giver_scene, receiver_scene: receiver_scene}
children:
  - ref: SetPrompt
    alias: AnnounceHandover
    dynamic_map: {robot: robot, sim_namespace: sim_namespace, scene_id: scene_id}
    static_args: {subtask: "${prompts.handover}"}
  - ref: GetPrimPose
    alias: LocateHandover
    dynamic_map: {robot: giver, sim_namespace: sim_namespace, scene_namespace: scene_namespace}
    static_args: {prim_path: /PegTransfer/handover}
    output_map: {pose: marker}
  - ref: GetPrimPose
    alias: LocateHeldBlock
    dynamic_map: {robot: giver, sim_namespace: sim_namespace, scene_namespace: scene_namespace}
    static_args: {prim_path: "${plan.block}"}
    output_map: {pose: held_block}
  - ref: GetPrimPose
    alias: LocateHoldingTip
    dynamic_map: {robot: giver, sim_namespace: sim_namespace, scene_namespace: scene_namespace}
    static_args: {prim_path: "${tip_prim.giver}"}
    output_map: {pose: holding_tip}
  - ref: GetPrimPose
    alias: LocateWaitingTip
    dynamic_map: {robot: receiver, sim_namespace: sim_namespace, scene_namespace: scene_namespace}
    static_args: {prim_path: "${tip_prim.receiver}"}
    output_map: {pose: waiting_tip}
  - ref: HandoverPoses
    dynamic_map: {marker: marker, block: held_block, held: holding_tip, giver_scene: giver_scene, receiver_scene: receiver_scene, receiver_tip: waiting_tip}
  # the receiver waits under the marker: up first, jaws shut, before the block comes (rising under the
  # held block, open, it knocked it out of the giver's jaws), then over it, and only there it opens
  - {ref: MoveToCartesianPose, alias: ReceiverRises, dynamic_map: {robot: receiver, target_pose: receive_rise}, static_args: {speed: 0.2, cartesian: true}}
  - {ref: MoveToCartesianPose, alias: Give, dynamic_map: {robot: giver, target_pose: give}, static_args: {speed: 0.1, cartesian: true, perturb: true}}
  - {ref: MoveToCartesianPose, alias: ApproachReceive, dynamic_map: {robot: receiver, target_pose: receive_pre}, static_args: {speed: 0.2, cartesian: true, perturb: true, precise_end: false, aim: true}}
  - {ref: OpenJaw, alias: ReceiverOpens, dynamic_map: {robot: receiver}}
  - node_type: CompositeNode
    name: Receive
    level: SEQUENCE
    dynamic_map: {receiver: receiver, sim_namespace: sim_namespace, scene_namespace: scene_namespace, receive: receive, receive_pre: receive_pre}
    children:
      # ApproachReceive's aimed miss corrected over the wall: corrected on the way down, a jaw landed on it
      - {ref: MoveToCartesianPose, alias: AlignOverWall, dynamic_map: {robot: receiver, target_pose: receive_pre}, static_args: {speed: 0.05, cartesian: true}}
      - ref: MissPose
        alias: MissReceive
        dynamic_map: {pose: receive}
        static_args: {key: "${plan.colour}", miss: "${oc.select:miss.receive,null}", seed: "${oc.select:miss.seed,0}"}
        output_map: {pose: receive_target}
      - {ref: MoveToCartesianPose, alias: MoveToReceive, dynamic_map: {robot: receiver, target_pose: receive_target}, static_args: {speed: 0.05, cartesian: true}}
      - {ref: CloseJaw, alias: ReceiverCloses, dynamic_map: {robot: receiver}}
      - {ref: WaitForSeconds, alias: ReceiveSettle, static_args: {seconds: 1.0}}
      - ref: GetPrimPose
        alias: LocateReceiverTip
        dynamic_map: {robot: receiver, sim_namespace: sim_namespace, scene_namespace: scene_namespace}
        static_args: {prim_path: "${tip_prim.receiver}"}
        output_map: {pose: receiver_tip}
      - ref: GetPrimPose
        alias: LocateReceived
        dynamic_map: {robot: receiver, sim_namespace: sim_namespace, scene_namespace: scene_namespace}
        static_args: {prim_path: "${plan.block}"}
        output_map: {pose: received_block}
      - {ref: IsHeld, alias: CheckReceived, dynamic_map: {tip: receiver_tip, block: received_block}, output_map: {held: received}}
    mode: condition
    condition_expr: received
    false_branch: {ref: NodeException, alias: NotReceived}
  - {ref: OpenJaw, alias: GiverLetsGo, dynamic_map: {robot: giver}}
  - {ref: WaitForSeconds, alias: LetGoSettle, static_args: {seconds: 0.5}}
  - {ref: MoveToCartesianPose, alias: GiverBacksOff, dynamic_map: {robot: giver, target_pose: give_back}, static_args: {speed: 0.1, cartesian: true}}
  - {ref: MoveToJointConfiguration, alias: GiverHome, dynamic_map: {robot: giver}, static_args: {target_configuration: "${psm.home}", speed: 0.2}}
fallbacks:
  Receive:
    node_type: RecoveryNode
    name: Rereceive
    level: SEQUENCE
    dynamic_map: {robot: robot, sim_namespace: sim_namespace, scene_id: scene_id, receiver: receiver, receive_pre: receive_pre}
    resume_target: Receive
    max_retries: 2
    children:
      - ref: SetPrompt
        alias: AnnounceRereceive
        dynamic_map: {robot: robot, sim_namespace: sim_namespace, scene_id: scene_id}
        static_args: {subtask: "${prompts.rereceive}"}
      - {ref: OpenJaw, alias: ReopenToReceive, dynamic_map: {robot: receiver}}
      - {ref: MoveToCartesianPose, alias: BackToReceivePre, dynamic_map: {robot: receiver, target_pose: receive_pre}, static_args: {speed: 0.1, cartesian: true}}
      - ref: SetPrompt
        alias: BackToHandover
        dynamic_map: {robot: robot, sim_namespace: sim_namespace, scene_id: scene_id}
        static_args: {subtask: "${prompts.handover}"}

