# Jaw to jaw, both level (targets.HandoverPoses): the giver turns its wrist level on the way from the
# lift and brings the block it holds to the handover marker (/PegTransfer/handover, jittered by
# randomize.yaml), its jaws pointing at the receiver and holding the block out sideways; the receiver
# turns level too, comes in along its own jaws onto the block's other end face, pointing back at the
# giver, opens there and takes it (Receive, which fails NotReceived unless the block sits in its jaws:
# targets.IsHeld). The giver lets go, backs out along its own jaws past the block (targets.RETREAT),
# rises 2 cm and goes home, tool down over the pegs.
# retry_mixed / light_fail (MissPose miss.receive): the receiver closes 18-22 mm along the wall, on
# air; Rereceive opens it, backs out along its jaws, comes back in front of the wall and Receive runs again.
node_type: CompositeNode
name: HandOver
level: SUBTASK
dynamic_map: {robot: robot, giver: giver, receiver: receiver, sim_namespace: sim_namespace, scene_namespace: scene_namespace, scene_id: scene_id, giver_scene: giver_scene, receiver_scene: receiver_scene}
children:
  - ref: SetPrompt
    alias: AnnounceHandover
    dynamic_map: {robot: robot, sim_namespace: sim_namespace, scene_id: scene_id}
    static_args: {subtask: "${prompts.handover}"}
  - ref: GetPrimPose
    alias: LocateHandover
    dynamic_map: {robot: giver, sim_namespace: sim_namespace, scene_namespace: scene_namespace}
    static_args: {prim_path: /PegTransfer/handover}
    output_map: {pose: marker}
  - ref: GetPrimPose
    alias: LocateHeldBlock
    dynamic_map: {robot: giver, sim_namespace: sim_namespace, scene_namespace: scene_namespace}
    static_args: {prim_path: "${plan.block}"}
    output_map: {pose: held_block}
  - ref: GetPrimPose
    alias: LocateHoldingTip
    dynamic_map: {robot: giver, sim_namespace: sim_namespace, scene_namespace: scene_namespace}
    static_args: {prim_path: "${tip_prim.giver}"}
    output_map: {pose: holding_tip}
  - ref: HandoverPoses
    dynamic_map: {marker: marker, block: held_block, held: holding_tip, giver_scene: giver_scene, receiver_scene: receiver_scene}
    static_args: {home: "${psm.home.giver}"}
  # the giver turns level on the way (a joint move), 2 cm short, then in along its jaws; the receiver, jaws shut,
  # comes in front of the block's far end face and only there it opens
  - {ref: MoveToJointConfiguration, alias: TurnLevel, dynamic_map: {robot: giver, target_configuration: give_pre_joints}, static_args: {speed: 0.1}}
  - {ref: MoveToCartesianPose, alias: Give, dynamic_map: {robot: giver, target_pose: give}, static_args: {speed: 0.05, cartesian: true}}
  - {ref: WaitForSeconds, alias: GiveSettle, static_args: {seconds: 0.5}}
  # the receiver's grip from the block where it now sits in the giver's jaws (it may have turned in them)
  - ref: GetPrimPose
    alias: LocateGivenBlock
    dynamic_map: {robot: receiver, sim_namespace: sim_namespace, scene_namespace: scene_namespace}
    static_args: {prim_path: "${plan.block}"}
    output_map: {pose: given_block}
  - ref: GetPrimPose
    alias: LocateGivingTip
    dynamic_map: {robot: receiver, sim_namespace: sim_namespace, scene_namespace: scene_namespace}
    static_args: {prim_path: "${tip_prim.giver}"}
    output_map: {pose: giving_tip}
  - {ref: ReceivePoses, dynamic_map: {block: given_block, giver_tip: giving_tip, scene: receiver_scene}}
  - {ref: MoveToCartesianPose, alias: ApproachReceive, dynamic_map: {robot: receiver, target_pose: receive_pre}, static_args: {speed: 0.2, cartesian: true, perturb: true, precise_end: false, aim: true}}
  - {ref: OpenJaw, alias: ReceiverOpens, dynamic_map: {robot: receiver}}
  - node_type: CompositeNode
    name: Receive
    level: SEQUENCE
    dynamic_map: {receiver: receiver, sim_namespace: sim_namespace, scene_namespace: scene_namespace, receive: receive, receive_pre: receive_pre}
    children:
      # ApproachReceive's aimed miss corrected in front of the wall: corrected on the way in, a jaw hit it
      - {ref: MoveToCartesianPose, alias: AlignWithWall, dynamic_map: {robot: receiver, target_pose: receive_pre}, static_args: {speed: 0.05, cartesian: true}}
      - ref: MissPose
        alias: MissReceive
        dynamic_map: {pose: receive}
        static_args: {key: "${plan.colour}", miss: "${oc.select:miss.receive,null}", seed: "${oc.select:miss.seed,0}"}
        output_map: {pose: receive_target}
      - {ref: MoveToCartesianPose, alias: MoveToReceive, dynamic_map: {robot: receiver, target_pose: receive_target}, static_args: {speed: 0.05, cartesian: true}}
      - {ref: CloseJaw, alias: ReceiverCloses, dynamic_map: {robot: receiver}}
      - {ref: WaitForSeconds, alias: ReceiveSettle, static_args: {seconds: 1.0}}
      - ref: GetPrimPose
        alias: LocateReceiverTip
        dynamic_map: {robot: receiver, sim_namespace: sim_namespace, scene_namespace: scene_namespace}
        static_args: {prim_path: "${tip_prim.receiver}"}
        output_map: {pose: receiver_tip}
      - ref: GetPrimPose
        alias: LocateReceived
        dynamic_map: {robot: receiver, sim_namespace: sim_namespace, scene_namespace: scene_namespace}
        static_args: {prim_path: "${plan.block}"}
        output_map: {pose: received_block}
      - {ref: IsHeld, alias: CheckReceived, dynamic_map: {tip: receiver_tip, block: received_block}, output_map: {held: received}}
    mode: condition
    condition_expr: received
    false_branch: {ref: NodeException, alias: NotReceived}
    fallbacks:  # stalled on contact short of the grip: close there, CheckReceived judges it
      MoveToReceive:
        node_type: RecoveryNode
        name: MoveToReceiveContact
        level: SEQUENCE
        resume_target: ReceiverCloses
        max_retries: 1
        children:
          - {ref: WaitForSeconds, alias: MoveToReceiveStalled, static_args: {seconds: 0.1}}
  - {ref: OpenJaw, alias: GiverLetsGo, dynamic_map: {robot: giver}}
  - {ref: WaitForSeconds, alias: LetGoSettle, static_args: {seconds: 0.5}}
  - {ref: MoveToCartesianPose, alias: GiverBacksOff, dynamic_map: {robot: giver, target_pose: give_back}, static_args: {speed: 0.1, cartesian: true}}
  - {ref: MoveToCartesianPose, alias: GiverRises, dynamic_map: {robot: giver, target_pose: give_rise}, static_args: {speed: 0.1, cartesian: true}}
  - {ref: MoveToJointConfiguration, alias: GiverHome, dynamic_map: {robot: giver}, static_args: {target_configuration: "${psm.home.giver}", speed: 0.2}}
fallbacks:
  Receive:
    node_type: RecoveryNode
    name: Rereceive
    level: SEQUENCE
    dynamic_map: {robot: robot, sim_namespace: sim_namespace, scene_id: scene_id, receiver: receiver, receive_pre: receive_pre, receive_target: receive_target}
    resume_target: Receive
    max_retries: 2
    children:
      - ref: SetPrompt
        alias: AnnounceRereceive
        dynamic_map: {robot: robot, sim_namespace: sim_namespace, scene_id: scene_id}
        static_args: {subtask: "${prompts.rereceive}"}
      - {ref: OpenJaw, alias: ReopenToReceive, dynamic_map: {robot: receiver}}
      - ref: TransformPose
        alias: BackOutPose
        dynamic_map: {l_pose: receive_target}
        static_args: {r_pose: {position: [0.0, 0.0, "${offsets.approach}"]}}  # back along its jaws
        output_map: {pose: receive_back}
      - {ref: MoveToCartesianPose, alias: BackOutOfMiss, dynamic_map: {robot: receiver, target_pose: receive_back}, static_args: {speed: 0.05, cartesian: true}}
      - {ref: MoveToCartesianPose, alias: BackToReceivePre, dynamic_map: {robot: receiver, target_pose: receive_pre}, static_args: {speed: 0.1, cartesian: true}}
      - ref: SetPrompt
        alias: BackToHandover
        dynamic_map: {robot: robot, sim_namespace: sim_namespace, scene_id: scene_id}
        static_args: {subtask: "${prompts.handover}"}

