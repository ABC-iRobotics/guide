# The receiver carries the block from the handover over the target peg, turning it tool down on the way
# (one joint move to targets.APPROACH over Finish's targets.PlacePoses `over`, the turn about up that turns
# its wrist least), comes down to `over` (the block's bottom 1 cm over the peg top; perturbed, a free end
# missing it (aim), LowerOntoPeg's first millimetres correcting it), lowers it 1.5 mm onto the peg (targets.TOUCH), and OnPeg fails
# (NotSeated) unless the block went onto the peg, not its top; then it lowers it to 1 mm over the board,
# lets go wide and backs 3 cm up, its jaws clear of the peg top (unperturbed: the inner jaw starts 2.6 mm
# from the peg), a free end ReturnToStart's move home blends out of. Its own arm only: Finish's branch beside
# GiverReturns.
# light_fail / retry_mixed (MissPose miss.place): the block comes down 4.5-5.5 mm off the peg's axis
# and lands on the peg top; Replace lifts it back over the peg, re-aims from where it now sits in the jaws
# and the place runs again from TouchPose.
node_type: CompositeNode
name: PlaceOnPeg
level: SEQUENCE
dynamic_map: {receiver: receiver, sim_namespace: sim_namespace, scene_namespace: scene_namespace, scene_id: scene_id, receiver_scene: receiver_scene, over: over, peg_pose: peg_pose}
children:
  - ref: SetPrompt
    alias: AnnouncePlace
    dynamic_map: {robot: receiver, sim_namespace: sim_namespace, scene_id: scene_id}
    static_args: {subtask: "${prompts.place}"}
  - ref: MissPose
    alias: MissPlace
    dynamic_map: {pose: over}
    static_args: {key: "${plan.colour}", miss: "${oc.select:miss.place,null}", seed: "${oc.select:miss.seed,0}"}
    output_map: {pose: over_target}
  - ref: TransformPose
    alias: HighOverPeg
    dynamic_map: {l_pose: over_target}
    static_args: {r_pose: {position: [0.0, 0.0, "${offsets.approach}"]}}  # up the tool (tool down: up)
    output_map: {pose: high_over}
  # a joint move: the planner's IK following the straight turn from level to tool down ran the wrist into its limits
  - {ref: JointsFor, alias: OverPegJoints, dynamic_map: {pose: high_over, robot: receiver}, output_map: {joints: over_joints}}
  - {ref: MoveToJointConfiguration, alias: TurnDownOverPeg, dynamic_map: {robot: receiver, target_configuration: over_joints}, static_args: {speed: 0.1}}
  - {ref: MoveToCartesianPose, alias: DownOverPeg, dynamic_map: {robot: receiver, target_pose: over_target}, static_args: {speed: 0.1, cartesian: true, perturb: true, precise_end: false, aim: true}}
  - ref: TransformPose
    alias: TouchPose
    dynamic_map: {l_pose: over_target}
    static_args: {r_pose: {position: [0.0, 0.0, "${offsets.touch}"]}}  # targets.TOUCH down the tool
    output_map: {pose: touch_target}
  - {ref: MoveToCartesianPose, alias: LowerOntoPeg, dynamic_map: {robot: receiver, target_pose: touch_target}, static_args: {speed: 0.05, cartesian: true}}
  - ref: GetPrimPose
    alias: LocatePlaced
    dynamic_map: {robot: receiver, sim_namespace: sim_namespace, scene_namespace: scene_namespace}
    static_args: {prim_path: "${plan.block}"}
    output_map: {pose: placed}
  - {ref: IsSeated, alias: OnPeg, dynamic_map: {block: placed, peg: peg_pose, scene: receiver_scene}, static_args: {entering: true}}
  - ref: TransformPose
    alias: SeatPose
    dynamic_map: {l_pose: over_target}
    static_args: {r_pose: {position: [0.0, 0.0, "${offsets.down}"]}}  # targets.DROP down the tool
    output_map: {pose: seat_target}
  - {ref: MoveToCartesianPose, alias: Lower, dynamic_map: {robot: receiver, target_pose: seat_target}, static_args: {speed: 0.05, cartesian: true}}
  - {ref: OpenJaw, alias: Release, dynamic_map: {robot: receiver}, static_args: {gripper_goal_pos: {"${jaw.joint}": "${jaw.wide}"}}}
  - {ref: WaitForSeconds, alias: ReleaseSettle, static_args: {seconds: 0.5}}
  - ref: TransformPose
    alias: RetreatPose
    dynamic_map: {l_pose: seat_target}
    static_args: {r_pose: {position: [0.0, 0.0, 0.03]}}
    output_map: {pose: retreat}
  - {ref: MoveToCartesianPose, alias: Retreat, dynamic_map: {robot: receiver, target_pose: retreat}, static_args: {speed: 0.1, cartesian: true, precise_end: false}}
fallbacks:
  LowerOntoPeg:  # stalled on the peg top: OnPeg judges where it stopped
    node_type: RecoveryNode
    name: LowerContact
    level: SEQUENCE
    resume_target: LocatePlaced
    max_retries: 1
    children:
      - {ref: WaitForSeconds, alias: LowerStalled, static_args: {seconds: 0.1}}
  Lower:  # stalled on the board, the block down on the peg: let go there
    node_type: RecoveryNode
    name: SeatContact
    level: SEQUENCE
    resume_target: Release
    max_retries: 1
    children:
      - {ref: WaitForSeconds, alias: SeatStalled, static_args: {seconds: 0.1}}
  OnPeg:
    node_type: RecoveryNode
    name: Replace
    level: SEQUENCE
    dynamic_map: {sim_namespace: sim_namespace, scene_namespace: scene_namespace, scene_id: scene_id, receiver: receiver, over_target: over_target, peg_pose: peg_pose, receiver_scene: receiver_scene}
    resume_target: TouchPose
    max_retries: 2
    children:
      - ref: SetPrompt
        alias: AnnounceReplace
        dynamic_map: {robot: receiver, sim_namespace: sim_namespace, scene_id: scene_id}
        static_args: {subtask: "${prompts.replace}"}
      - {ref: MoveToCartesianPose, alias: LiftOffPegTop, dynamic_map: {robot: receiver, target_pose: over_target}, static_args: {speed: 0.05, cartesian: true}}
      # the peg top may have pushed the block along the jaws: over and seat again from where it now sits
      - ref: GetPrimPose
        alias: RelocatePlacingTip
        dynamic_map: {robot: receiver, sim_namespace: sim_namespace, scene_namespace: scene_namespace}
        static_args: {prim_path: "${tip_prim.receiver}"}
        output_map: {pose: placing_tip}
      - ref: GetPrimPose
        alias: RelocateCarried
        dynamic_map: {robot: receiver, sim_namespace: sim_namespace, scene_namespace: scene_namespace}
        static_args: {prim_path: "${plan.block}"}
        output_map: {pose: carried}
      - ref: PlacePoses
        alias: ReplacePoses
        dynamic_map: {peg: peg_pose, scene: receiver_scene, tip: placing_tip, block: carried, robot: receiver}
        static_args: {keep: true}
        output_map: {over: over_target}
      - ref: SetPrompt
        alias: BackToPlace
        dynamic_map: {robot: receiver, sim_namespace: sim_namespace, scene_id: scene_id}
        static_args: {subtask: "${prompts.place}"}
      # tool down already: a straight move over the peg (no joint move: MissPose misses once anyway)
      - {ref: MoveToCartesianPose, alias: OverPegAgain, dynamic_map: {robot: receiver, target_pose: over_target}, static_args: {speed: 0.05, cartesian: true}}
