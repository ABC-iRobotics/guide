# The receiver turns tool down where it holds the block, brings it over the target peg (its bottom 1 cm
# over the peg top), lowers it to 1 mm over the board (Seat, which fails NotSeated unless the block sits
# down on the peg: targets.IsSeated, the success check's test), lets go and backs 2 cm up.
# light_fail / retry_mixed (MissPose miss.place): the block comes down 4.5-5.5 mm off the peg's axis
# and lands on the peg top; Replace lifts it back over the peg and Seat runs again.
node_type: CompositeNode
name: PlaceOnPeg
level: SUBTASK
dynamic_map: {robot: robot, receiver: receiver, sim_namespace: sim_namespace, scene_namespace: scene_namespace, scene_id: scene_id, receiver_scene: receiver_scene, receive: receive}
children:
  - ref: SetPrompt
    alias: AnnouncePlace
    dynamic_map: {robot: robot, sim_namespace: sim_namespace, scene_id: scene_id}
    static_args: {subtask: "${prompts.place}"}
  - ref: GetPrimPose
    alias: LocatePeg
    dynamic_map: {robot: receiver, sim_namespace: sim_namespace, scene_namespace: scene_namespace}
    static_args: {prim_path: "${plan.target_peg}"}
    output_map: {pose: peg_pose}
  - {ref: PlacePoses, dynamic_map: {peg: peg_pose, scene: receiver_scene, at: receive}}
  - {ref: MoveToCartesianPose, alias: TurnDown, dynamic_map: {robot: receiver, target_pose: turn_down}, static_args: {speed: 0.1, cartesian: true}}
  - {ref: MoveToCartesianPose, alias: MoveOverPeg, dynamic_map: {robot: receiver, target_pose: over}, static_args: {speed: 0.2, cartesian: true, perturb: true, precise_end: false, aim: true}}
  - node_type: CompositeNode
    name: Seat
    level: SEQUENCE
    dynamic_map: {receiver: receiver, sim_namespace: sim_namespace, scene_namespace: scene_namespace, receiver_scene: receiver_scene, over: over, peg_pose: peg_pose}
    children:
      - ref: MissPose
        alias: MissPlace
        dynamic_map: {pose: over}
        static_args: {key: "${plan.colour}", miss: "${oc.select:miss.place,null}", seed: "${oc.select:miss.seed,0}"}
        output_map: {pose: over_target}
      - {ref: MoveToCartesianPose, alias: AlignOverPeg, dynamic_map: {robot: receiver, target_pose: over_target}, static_args: {speed: 0.05, cartesian: true}}
      - ref: TransformPose
        alias: SeatPose
        dynamic_map: {l_pose: over_target}
        static_args: {r_pose: {position: [0.0, 0.0, "${offsets.down}"]}}  # targets.DROP down the tool
        output_map: {pose: seat_target}
      - {ref: MoveToCartesianPose, alias: Lower, dynamic_map: {robot: receiver, target_pose: seat_target}, static_args: {speed: 0.05, cartesian: true}}
      - ref: GetPrimPose
        alias: LocatePlaced
        dynamic_map: {robot: receiver, sim_namespace: sim_namespace, scene_namespace: scene_namespace}
        static_args: {prim_path: "${plan.block}"}
        output_map: {pose: placed}
      - {ref: IsSeated, dynamic_map: {block: placed, peg: peg_pose, scene: receiver_scene}}
    mode: condition
    condition_expr: seated
    false_branch: {ref: NodeException, alias: NotSeated}
  - {ref: OpenJaw, alias: Release, dynamic_map: {robot: receiver}}
  - {ref: WaitForSeconds, alias: ReleaseSettle, static_args: {seconds: 0.5}}
  - ref: TransformPose
    alias: RetreatPose
    dynamic_map: {l_pose: seat_target}
    static_args: {r_pose: {position: [0.0, 0.0, 0.02]}}
    output_map: {pose: retreat}
  - {ref: MoveToCartesianPose, alias: Retreat, dynamic_map: {robot: receiver, target_pose: retreat}, static_args: {speed: 0.1, cartesian: true}}
fallbacks:
  Seat:
    node_type: RecoveryNode
    name: Replace
    level: SEQUENCE
    dynamic_map: {receiver: receiver, over_target: over_target}
    resume_target: Seat
    max_retries: 2
    children:
      - {ref: MoveToCartesianPose, alias: LiftOffPegTop, dynamic_map: {robot: receiver, target_pose: over_target}, static_args: {speed: 0.05, cartesian: true}}
