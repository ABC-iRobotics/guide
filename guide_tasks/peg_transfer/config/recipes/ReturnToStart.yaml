# The receiver back to its home joints (the giver went home after the handover: GiverReturns).
node_type: CompositeNode
name: ReturnToStart
level: SUBTASK
dynamic_map: {robot: robot, receiver: receiver, sim_namespace: sim_namespace, scene_id: scene_id}
children:
  - ref: SetPrompt
    alias: AnnounceReturn
    dynamic_map: {robot: robot, sim_namespace: sim_namespace, scene_id: scene_id}
    static_args: {subtask: "${prompts.return}"}
  - {ref: MoveToJointConfiguration, alias: ReceiverHome, dynamic_map: {robot: receiver}, static_args: {target_configuration: "${psm.home.receiver}", speed: 0.2}}
