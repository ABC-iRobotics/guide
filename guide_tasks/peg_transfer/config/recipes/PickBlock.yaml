# The giver, down at the grasp already (GiverApproach), closes; it fails (NotHolding) unless the block sits
# in its jaws (targets.IsHeld: the block's centre where the tip's grip puts it). A planned miss (GiverApproach)
# closes on air: Transfer's Regrasp picks again, at the block this time.
node_type: CompositeNode
name: PickBlock
level: SUBTASK
dynamic_map: {robot: robot, giver: giver, sim_namespace: sim_namespace, scene_namespace: scene_namespace, scene_id: scene_id}
children:
  - ref: SetPrompt
    alias: AnnouncePick
    dynamic_map: {robot: robot, sim_namespace: sim_namespace, scene_id: scene_id}
    static_args: {subtask: "${prompts.pick}"}
  - {ref: CloseJaw, alias: CloseOnBlock, dynamic_map: {robot: giver}}
  - {ref: WaitForSeconds, alias: CloseSettle, static_args: {seconds: 1.0}}
  - ref: GetPrimPose
    alias: LocateGiverTip
    dynamic_map: {robot: giver, sim_namespace: sim_namespace, scene_namespace: scene_namespace}
    static_args: {prim_path: "${tip_prim.giver}"}
    output_map: {pose: giver_tip}
  - ref: GetPrimPose
    alias: LocateGrasped
    dynamic_map: {robot: giver, sim_namespace: sim_namespace, scene_namespace: scene_namespace}
    static_args: {prim_path: "${plan.block}"}
    output_map: {pose: grasped}
  - {ref: IsHeld, alias: CheckHolding, dynamic_map: {tip: giver_tip, block: grasped}, output_map: {held: holding}}
mode: condition
condition_expr: holding
false_branch: {ref: NodeException, alias: NotHolding}
