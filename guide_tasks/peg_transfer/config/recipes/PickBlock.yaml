# The giver opens, comes tool down over the block (targets.GraspPose: across one wall, one jaw in the
# ring's hole), descends onto it slowly and closes; it fails (NotHolding) unless its jaw holds the block.
# light_fail / retry_mixed (MissPose miss.grasp): the grasp lies 18-22 mm along the wall, off its end:
# the jaws close on air and Transfer's Regrasp picks again, at the block this time.
node_type: CompositeNode
name: PickBlock
level: SUBTASK
dynamic_map: {robot: robot, giver: giver, sim_namespace: sim_namespace, scene_namespace: scene_namespace, scene_id: scene_id, giver_scene: giver_scene}
children:
  - ref: SetPrompt
    alias: AnnouncePick
    dynamic_map: {robot: robot, sim_namespace: sim_namespace, scene_id: scene_id}
    static_args: {subtask: "${prompts.pick}"}
  - {ref: OpenJaw, alias: OpenForPick, dynamic_map: {robot: giver}}
  - ref: GetPrimPose
    alias: LocateBlock
    dynamic_map: {robot: giver, sim_namespace: sim_namespace, scene_namespace: scene_namespace}
    static_args: {prim_path: "${plan.block}"}
    output_map: {pose: block_pose}
  - {ref: GraspPose, dynamic_map: {block: block_pose, scene: giver_scene}, output_map: {pose: grasp_pose}}
  - ref: TransformPose
    alias: OverGrasp
    dynamic_map: {l_pose: grasp_pose}
    static_args: {r_pose: {position: [0.0, 0.0, "${offsets.approach}"]}}  # up the tool (tool down: up)
    output_map: {pose: over_grasp}
  - ref: MoveToCartesianPose
    alias: MoveOverBlock
    dynamic_map: {robot: giver, target_pose: over_grasp}
    static_args: {speed: 0.2, cartesian: true, perturb: true, precise_end: false, aim: true}
  - ref: MissPose
    alias: MissGrasp
    dynamic_map: {pose: grasp_pose}
    static_args: {key: "${plan.colour}", miss: "${oc.select:miss.grasp,null}", seed: "${oc.select:miss.seed,0}"}
    output_map: {pose: grasp_target}
  - ref: MoveToCartesianPose
    alias: MoveToGrasp
    dynamic_map: {robot: giver, target_pose: grasp_target}
    static_args: {speed: 0.05, cartesian: true}
  - {ref: CloseJaw, alias: CloseOnBlock, dynamic_map: {robot: giver}}
  - {ref: WaitForSeconds, alias: CloseSettle, static_args: {seconds: 1.0}}
  - ref: IsPrimClashing
    alias: CheckHolding
    dynamic_map: {robot: giver, sim_namespace: sim_namespace, scene_namespace: scene_namespace}
    static_args: {prim1_path: "${jaw_prim.giver}", prim2_path: "${plan.block}"}
    output_map: {has_collided: holding}
mode: condition
condition_expr: holding
false_branch: {ref: NodeException, alias: NotHolding}
