# GUIDE subtask planner: a lerobot TrainingRecipe for the language runtime on lerobot main
# (0.6.2.dev and later). lerobot 0.6.0 refuses it: there every branch needs a text target,
# and `act` is action-only on purpose.
#
# One model, two jobs, on GUIDE's prompt contract:
#   plan  (high_level, text target): from the cameras, the task and the subtask just
#         completed, say the subtask to do now. This is the planner that sets the subtasks:
#         at inference its answer is the `planner` source of the evaluation's
#         InstructionHolder, which the oracle (simulation) and an operator outrank.
#   act   (low_level, action flow): act on "<task> <subtask>" -- the string the prompt view
#         puts in `task` (guide_dataset_build --prompt-view) and the holder tells the policy.
#         SmolVLA trained on the prompt view is exactly this half, so a planner trained here
#         drives that SmolVLA unchanged.
#
# Data: GUIDE recordings as recorded (language_persistent, style=subtask), not a view: the
# recipe resolves each frame's subtask itself. Policy: one with a text head (pi0.5-class);
# set it with --policy.recipe_path (EO-1 / WALL-X) or the policy's equivalent.
#
# Inference: run `plan` when the arm opens after a placement or every few seconds, and keep
# its answer until the next run -- the holder only re-tells the policy on a change.

blend:
  plan:
    weight: 0.3
    bindings:
      done: "nth_prev(style=subtask, offset=1)"
    messages:
      - {role: user, content: "${task}", stream: high_level}
      - {role: user, content: "Done: ${done}", stream: high_level, if_present: done}
      - {role: assistant, content: "${subtask}", stream: high_level, target: true, if_present: subtask}

  act:
    weight: 0.7
    messages:
      - {role: user, content: "${task} ${subtask}", stream: low_level, if_present: subtask}
