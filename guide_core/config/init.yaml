startup:
  renderer: "RaytracedLighting"
  # No Kit window. The GUI viewport is a whole extra render target plus the UI, and
  # nothing reads it during generation or evaluation -- watch a camera over ROS instead
  # (guide_core/scripts/view_camera.py). Set False to get the window back for debugging.
  headless: True
  anti_aliasing: 0
  verbose: False
  step_freq: 60
  # PhysX Hz. 2x step_freq => 2 physics substeps per rendered frame; Isaac derives the
  # substep count from the ratio. This is the clock the recorder's interval is measured
  # against (SceneManager.step), so changing it does not change the recording rate.
  physics_freq: 120
  # PhysX on the GPU. Measured on this scene: physics is 2.1 ms idle and 39.6 ms
  # under an evaluation -- 52% of the frame -- while render stays flat at ~36 ms.
  # GPU dynamics is documented as a win at scale; this stage is one arm, two bins
  # and four blocks, and it shares the card the renderer is already saturating.
  gpu_dynamics: False
  # Pace the loop to sim time. Set false for batch demonstration generation to let the
  # sim run ahead of real time once a frame costs less than 1/step_freq.
  realtime: true
  # Viewport render resolution -- NOT the cameras. The camera render products are pinned
  # to the size the datasets were recorded at (see _set_render_resolution in _cmd_robot),
  # so this is the only render target free to shrink. Isaac's default is 1280x720.
  width: 640
  height: 360
  # This machine has two mismatched GPUs (RTX A4000 + A2000) with no CUDA peer
  # access. Isaac Sim's multi-GPU renderer then deadlocks on device 1 when a camera
  # RenderProduct is created ("Failed to begin render graph ... semaphore timed out").
  # Force single-GPU rendering on GPU 0 (the A4000). Override per-machine if needed.
  multi_gpu: False
  # Index 1 is the A4000, NOT index 0. Kit/nvidia-smi enumerate by PCI bus id, so 0 is
  # the A2000 -- and with active_gpu: 0 Isaac rendered on the weaker card, pegged at
  # 100% while the A4000 idled at 45%. CUDA orders the other way (FASTEST_FIRST), so
  # torch's cuda:0 is the A4000 and cuda:1 the A2000: an inference --device that reads
  # like "the other GPU" may well be this one. Confirm with nvidia-smi after a restart.
  active_gpu: 1

world:
  stage_units_in_meters: 1.0

extensions:
  - isaacsim.storage.native
